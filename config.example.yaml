# 复制为 config.yaml，填写 API 令牌、加密密钥及代理；初始化命令见 README。
app:
  db_path: ./data/temp-mail.db
  api_token: ""
  encryption_key: ""

worker:
  sync_interval_seconds: 15
  operation_timeout_seconds: 300
  poll_seconds: 1

# auto 按此处顺序选择满足能力要求的供应商；仅列出的供应商会注册。
providers:
  temp-mail-org:
    enabled: true
    # 仅说明供应商网站，不用于接口请求。
    index_url: https://temp-mail.org/
    base_url: https://web2.temp-mail.org
    timeout_seconds: 15
    impersonate: chrome110
    # 填写随机代理网关 URL；例如 http://user:password@host:port。
    # null 或空字符串保留 curl_cffi 的环境代理行为。
    proxy: null
  tempmail-lol:
    enabled: true
    index_url: https://tempmail.lol/
    base_url: https://api.tempmail.lol/v2
    timeout_seconds: 15
    impersonate: chrome110
    proxy: null
