# 复制为 config.yaml，填写 API 令牌、加密密钥及代理；初始化命令见 README。
app:
  db_path: ./data/temp-mail.db
  api_token: ""
  encryption_key: ""

worker:
  sync_interval_seconds: 15
  operation_timeout_seconds: 300
  poll_seconds: 1
  # 两类任务独立并行，均为 1–32 的整数；调低不会中断正在执行的任务。
  create_concurrency: 4
  receive_concurrency: 4

# auto 按此处顺序选择满足能力要求的供应商；仅列出的供应商会注册。
providers:
  temp-mail-org:
    enabled: true
    # 仅说明供应商网站，不用于接口请求。
    index_url: https://temp-mail.org/
    base_url: https://web2.temp-mail.org
    timeout_seconds: 15
    impersonate: chrome110
    # 最长本地有效期，60–31536000 整数秒；不会延长上游有效期。
    max_ttl_seconds: 86400
    # 填写随机代理网关 URL；例如 http://user:password@host:port。
    # null 或空字符串保留 curl_cffi 的环境代理行为。
    proxy: null
  tempmail-lol:
    enabled: true
    index_url: https://tempmail.lol/
    base_url: https://api.tempmail.lol/v2
    timeout_seconds: 15
    impersonate: chrome110
    max_ttl_seconds: 3600
    proxy: null
  22-do:
    enabled: true
    index_url: https://22.do/
    base_url: https://22.do
    timeout_seconds: 15
    impersonate: chrome110
    max_ttl_seconds: 86400
    proxy: null
  cloudflare-temp-email:
    enabled: false
    index_url: https://github.com/dreamhunter2333/cloudflare_temp_email
    # 填写自己部署实例的 Worker API 地址，然后启用。
    base_url: https://your-worker.example.invalid
    timeout_seconds: 15
    impersonate: chrome110
    max_ttl_seconds: 86400
    proxy: null
    # 留空时自动选择实例公开配置中的域名。
    domain: null
    # 可选：配置后通过管理员接口创建邮箱；留空使用公开创建接口。
    admin_password: null
    # 仅实例设置了站点访问密码时填写。
    site_password: null
