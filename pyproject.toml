[project]
name = "temp-mail"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn>=0.54.0",
    "cryptography>=46.0",
    "pyyaml>=6,<7",
    "curl-cffi>=0.14,<1",
    "loguru>=0.7.3,<0.8",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
